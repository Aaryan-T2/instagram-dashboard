<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Dashboard - Taffy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: rgba(255,255,255,0.04);
            --bg-card-hover: rgba(255,255,255,0.07);
            --border: rgba(255,255,255,0.06);
            --text-primary: #ffffff;
            --text-secondary: #8b8ba3;
            --text-muted: #5a5a7a;
            --accent-pink: #e91e63;
            --accent-purple: #9c27b0;
            --accent-blue: #2196f3;
            --accent-green: #00c853;
            --accent-orange: #ff9800;
            --gradient-main: linear-gradient(135deg, #e91e63, #9c27b0, #2196f3);
            --gradient-card: linear-gradient(135deg, rgba(233,30,99,0.1), rgba(156,39,176,0.1));
            --shadow-card: 0 4px 24px rgba(0,0,0,0.3);
            --radius: 16px;
            --radius-sm: 10px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(233,30,99,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(33,150,243,0.06) 0%, transparent 50%),
                        radial-gradient(circle at 40% 80%, rgba(156,39,176,0.06) 0%, transparent 50%);
            animation: bgFloat 20s ease-in-out infinite;
            z-index: -1;
        }
        @keyframes bgFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(2%, -2%) rotate(1deg); }
            66% { transform: translate(-1%, 1%) rotate(-1deg); }
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 32px 24px; }
        header { text-align: center; margin-bottom: 48px; position: relative; }
        .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .logo-icon {
            width: 48px;
            height: 48px;
            background: var(--gradient-main);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 20px rgba(233,30,99,0.3);
        }
        header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        header h1 span {
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,200,83,0.15);
            color: var(--accent-green);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 12px;
            border: 1px solid rgba(0,200,83,0.2);
        }
        .live-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }
        .subtitle { color: var(--text-secondary); margin-top: 8px; font-size: 0.9rem; }
        .overview { margin-bottom: 48px; }
        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }
        .section-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        .section-header .line {
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .overview-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }
        .overview-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px;
            text-align: center;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .overview-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--gradient-main);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .overview-card:hover {
            background: var(--bg-card-hover);
            border-color: rgba(233,30,99,0.2);
            transform: translateY(-2px);
        }
        .overview-card:hover::before { opacity: 1; }
        .overview-card .icon { font-size: 1.5rem; margin-bottom: 12px; }
        .overview-card .label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .overview-card .value {
            display: block;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .overview-card .timer {
            color: var(--accent-green);
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 1.6rem;
        }
        .channels { margin-bottom: 48px; }
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .channel-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 28px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            position: relative;
        }
        .channel-card:hover {
            background: var(--bg-card-hover);
            border-color: rgba(233,30,99,0.15);
            box-shadow: var(--shadow-card);
        }
        .channel-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        .channel-avatar {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        .channel-avatar.pink { background: rgba(233,30,99,0.15); }
        .channel-avatar.purple { background: rgba(156,39,176,0.15); }
        .channel-avatar.blue { background: rgba(33,150,243,0.15); }
        .channel-info { flex: 1; }
        .channel-info h3 { font-size: 1rem; font-weight: 600; margin-bottom: 2px; }
        .channel-info .alias { color: var(--text-muted); font-size: 0.8rem; }
        .channel-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat {
            background: rgba(0,0,0,0.2);
            padding: 14px;
            border-radius: var(--radius-sm);
            text-align: center;
        }
        .stat-label {
            display: block;
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 500;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-value {
            display: block;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-pink);
        }
        .stat-value.green { color: var(--accent-green); }
        .stat-value.blue { color: var(--accent-blue); }
        .stat-value.orange { color: var(--accent-orange); }
        .channel-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        .drive-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: color 0.2s;
        }
        .drive-link:hover { color: #64b5f6; }
        .drive-badge {
            background: rgba(0,200,83,0.12);
            color: var(--accent-green);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .subfolders {
            margin-top: 12px;
            padding: 12px;
            background: rgba(0,0,0,0.15);
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .subfolders span { color: var(--text-secondary); }
        .schedule { margin-bottom: 48px; }
        .schedule-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 32px;
            border: 1px solid var(--border);
        }
        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 24px;
        }
        .schedule-item {
            text-align: center;
            padding: 20px;
            background: rgba(0,0,0,0.15);
            border-radius: var(--radius-sm);
        }
        .schedule-item .emoji { font-size: 1.5rem; margin-bottom: 10px; }
        .schedule-item h4 { font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; }
        .schedule-item p { color: var(--text-muted); font-size: 0.8rem; }
        .refresh-btn {
            background: var(--gradient-main);
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 24px;
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(233,30,99,0.3);
        }
        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(233,30,99,0.4);
        }
        .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        footer {
            text-align: center;
            padding: 24px;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
        }
        footer strong { color: var(--accent-pink); }
        .update-time { font-size: 0.8rem; margin-top: 8px; color: var(--text-muted); }
        .loading { text-align: center; padding: 60px; color: var(--text-muted); font-size: 0.95rem; }
        .loading .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent-pink);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 1024px) {
            .overview-cards { grid-template-columns: repeat(2, 1fr); }
            .channel-grid { grid-template-columns: 1fr; }
            .schedule-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 640px) {
            .overview-cards { grid-template-columns: 1fr 1fr; }
            header h1 { font-size: 1.5rem; }
            .container { padding: 20px 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">📊</div>
                <h1><span>Instagram Dashboard</span></h1>
            </div>
            <div class="live-badge">
                <span class="live-dot"></span>
                LIVE
            </div>
            <p class="subtitle">Auto-updating every 5 minutes · Managed by Taffy</p>
        </header>
        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                Loading live data...
            </div>
        </div>
        <footer>
            <p>Managed by <strong>Taffy</strong> · Instagram DM Monitor & Auto Poster</p>
            <p class="update-time">Last updated: <span id="last-update">--</span></p>
        </footer>
    </div>
    <script>
        let dashboardData = null;
        async function fetchData() {
            try {
                const res = await fetch('/api/data');
                if (!res.ok) throw new Error('Failed to fetch');
                dashboardData = await res.json();
                render();
            } catch (e) {
                console.error('Error:', e);
                document.getElementById('content').innerHTML = 
                    `<div class="loading">
                        <p>Failed to load data</p>
                        <button class="refresh-btn" onclick="fetchData()" style="margin-top:16px">Retry</button>
                    </div>`;
            }
        }
        async function forceRefresh() {
            const btn = document.querySelector('.refresh-btn');
            if (btn) btn.disabled = true;
            try {
                await fetch('/api/refresh', { method: 'POST' });
                await fetchData();
            } finally {
                if (btn) btn.disabled = false;
            }
        }
        function render() {
            if (!dashboardData || !dashboardData.accounts) return;
            const accounts = dashboardData.accounts;
            const accountList = Object.values(accounts);
            const totalFollowers = accountList.reduce((s, a) => s + (a.followers || 0), 0);
            const totalDrive = accountList.reduce((s, a) => s + (a.driveVideos || 0), 0);
            const todayPosts = (dashboardData.postingLog || []).filter(p => {
                const d = new Date(p.timestamp);
                const now = new Date();
                return d.toDateString() === now.toDateString();
            }).length;
            const colors = ['pink', 'purple', 'blue'];
            let html = `
                <section class="overview">
                    <div class="section-header">
                        <h2>Overview</h2>
                        <div class="line"></div>
                    </div>
                    <div class="overview-cards">
                        <div class="overview-card">
                            <div class="icon">👥</div>
                            <span class="label">Total Followers</span>
                            <span class="value">${totalFollowers > 0 ? formatNum(totalFollowers) : '<100'}</span>
                        </div>
                        <div class="overview-card">
                            <div class="icon">🎬</div>
                            <span class="label">Posted Today</span>
                            <span class="value">${todayPosts}</span>
                        </div>
                        <div class="overview-card">
                            <div class="icon">⏱️</div>
                            <span class="label">Next Video In</span>
                            <span class="value timer" id="next-video-timer">--:--:--</span>
                        </div>
                        <div class="overview-card">
                            <div class="icon">📁</div>
                            <span class="label">Videos in Drive</span>
                            <span class="value">${formatNum(totalDrive)}</span>
                        </div>
                    </div>
                </section>
                <section class="channels">
                    <div class="section-header">
                        <h2>Channels</h2>
                        <div class="line"></div>
                    </div>
                    <div class="channel-grid">
                        ${accountList.map((a, i) => `
                            <div class="channel-card">
                                <div class="channel-header">
                                    <div class="channel-avatar ${colors[i]}">${a.icon}</div>
                                    <div class="channel-info">
                                        <h3>@${a.username}</h3>
                                        <span class="alias">${a.alias}</span>
                                    </div>
                                </div>
                                <div class="channel-stats">
                                    <div class="stat">
                                        <span class="stat-label">Followers</span>
                                        <span class="stat-value">${a.followers > 0 ? formatNum(a.followers) : '<100'}</span>
                                    </div>
                                    <div class="stat">
                                        <span class="stat-label">Reach</span>
                                        <span class="stat-value green">${a.reach > 0 ? formatNum(a.reach) : '0'}</span>
                                    </div>
                                    <div class="stat">
                                        <span class="stat-label">Posts</span>
                                        <span class="stat-value blue">${a.mediaCount || 0}</span>
                                    </div>
                                    <div class="stat">
                                        <span class="stat-label">Drive</span>
                                        <span class="stat-value orange">${a.driveVideos || 0}</span>
                                    </div>
                                </div>
                                <div class="channel-footer">
                                    <a href="https://drive.google.com/drive/folders/${a.driveFolderId}" target="_blank" class="drive-link">
                                        📁 Google Drive
                                    </a>
                                    <span class="drive-badge">${a.driveVideos} videos</span>
                                </div>
                                ${a.subfolders ? `
                                    <div class="subfolders">
                                        <span>📂</span> ${a.subfolders.map(f => f.name).join(' · ')}
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>
                </section>
                <section class="schedule">
                    <div class="section-header">
                        <h2>Posting Schedule</h2>
                        <div class="line"></div>
                    </div>
                    <div class="schedule-card">
                        <div class="schedule-grid">
                            <div class="schedule-item">
                                <div class="emoji">🎯</div>
                                <h4>Daily Goal</h4>
                                <p>6 videos total (2 per channel)</p>
                            </div>
                            <div class="schedule-item">
                                <div class="emoji">📋</div>
                                <h4>Order</h4>
                                <p>In sequence from each folder, no repeats</p>
                            </div>
                            <div class="schedule-item">
                                <div class="emoji">⚡</div>
                                <h4>Workflow</h4>
                                <p>Download → Transcribe → Caption → Post</p>
                            </div>
                        </div>
                        <div style="text-align:center">
                            <button class="refresh-btn" onclick="forceRefresh()">🔄 Refresh Data</button>
                        </div>
                    </div>
                </section>
            `;
            document.getElementById('content').innerHTML = html;
            document.getElementById('last-update').textContent = new Date(dashboardData.lastUpdated).toLocaleString();
            updateCountdown();
        }
        function formatNum(n) {
            if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
            if (n >= 1000) return (n/1000).toFixed(1) + 'K';
            return n.toString();
        }
        function updateCountdown() {
            const now = new Date();
            const h = now.getHours();
            let next;
            if (h < 9) { next = new Date(now); next.setHours(9,0,0,0); }
            else if (h < 18) { next = new Date(now); next.setHours(18,0,0,0); }
            else { next = new Date(now); next.setDate(next.getDate()+1); next.setHours(9,0,0,0); }
            const diff = next - now;
            const hh = Math.floor(diff/3600000);
            const mm = Math.floor((diff%3600000)/60000);
            const ss = Math.floor((diff%60000)/1000);
            const el = document.getElementById('next-video-timer');
            if (el) {
                el.textContent = `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
            }
        }
        fetchData();
        setInterval(updateCountdown, 1000);
        setInterval(fetchData, 300000);
    </script>
</body>
</html>
