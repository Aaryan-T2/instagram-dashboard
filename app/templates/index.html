<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Instagram Dashboard - Taffy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #e8edf5;
            --bg-gradient: linear-gradient(135deg, #e8edf5 0%, #dce4f0 40%, #e6eef8 100%);
            --sidebar-bg: #f4f6fb;
            --card-bg: #ffffff;
            --card-shadow: 0 1px 8px rgba(0,0,0,0.04), 0 4px 24px rgba(0,0,0,0.03);
            --card-shadow-hover: 0 2px 12px rgba(0,0,0,0.06), 0 8px 32px rgba(0,0,0,0.05);
            --text-primary: #1a1a2e;
            --text-secondary: #6b7094;
            --text-muted: #9ca3c0;
            --accent: #4f6df5;
            --accent-light: rgba(79,109,245,0.08);
            --accent-green: #34c759;
            --accent-orange: #f5a623;
            --accent-pink: #e84393;
            --border: rgba(0,0,0,0.04);
            --radius: 16px;
            --radius-sm: 10px;
            --sidebar-width: 220px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh; min-height: 100dvh;
            display: flex; overflow-x: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width); min-height: 100vh; min-height: 100dvh;
            background: var(--sidebar-bg); padding: 28px 20px;
            display: flex; flex-direction: column;
            border-right: 1px solid var(--border);
            position: fixed; left: 0; top: 0; bottom: 0; z-index: 100;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 36px; }
        .sidebar-brand .icon {
            width: 36px; height: 36px; background: var(--accent); border-radius: 10px;
            display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
        }
        .sidebar-brand .name { font-size: 0.95rem; font-weight: 600; }
        .sidebar-brand .desc { font-size: 0.7rem; color: var(--text-muted); }
        .sidebar-nav { flex: 1; }
        .nav-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; border-radius: var(--radius-sm);
            cursor: pointer; font-size: 0.88rem;
            color: var(--text-secondary); transition: all 0.2s; margin-bottom: 4px;
            user-select: none;
        }
        .nav-item:hover { background: rgba(79,109,245,0.06); color: var(--text-primary); }
        .nav-item.active { background: var(--accent-light); color: var(--accent); font-weight: 500; }
        .nav-item .emoji { font-size: 1.1rem; }
        .sidebar-footer { padding-top: 20px; border-top: 1px solid var(--border); }
        .user-card { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: var(--radius-sm); }
        .user-avatar {
            width: 32px; height: 32px; background: var(--accent); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem; color: #fff; font-weight: 600; flex-shrink: 0;
        }
        .user-info .name { font-size: 0.82rem; font-weight: 500; }
        .user-info .handle { font-size: 0.7rem; color: var(--text-muted); }

        /* Overlay & Hamburger */
        .sidebar-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.3); z-index: 99; opacity: 0; transition: opacity 0.3s;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }
        .hamburger {
            display: none; position: fixed; top: 16px; left: 16px; z-index: 101;
            width: 40px; height: 40px; background: var(--card-bg); border: none;
            border-radius: 10px; box-shadow: var(--card-shadow); cursor: pointer;
            align-items: center; justify-content: center; font-size: 1.2rem;
        }

        /* Main */
        .main { flex: 1; margin-left: var(--sidebar-width); padding: 36px 48px; min-height: 100vh; min-height: 100dvh; }
        .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 36px; gap: 16px; }
        .header-left .label {
            font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px;
            color: var(--text-muted); font-weight: 500; margin-bottom: 4px;
        }
        .header-left h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 500; }
        .header-left h1 em { color: var(--text-muted); font-style: italic; }
        .header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .date-badge {
            display: flex; align-items: center; gap: 8px;
            background: var(--card-bg); padding: 8px 14px; border-radius: 10px;
            font-size: 0.8rem; color: var(--text-secondary); box-shadow: var(--card-shadow); white-space: nowrap;
        }
        .live-dot { width: 7px; height: 7px; background: var(--accent-green); border-radius: 50%; animation: pulse 2s infinite; flex-shrink: 0; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* Cards */
        .card { background: var(--card-bg); border-radius: var(--radius); padding: 24px; box-shadow: var(--card-shadow); }
        .card-title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: 500; margin-bottom: 16px; }

        /* Pages */
        .page { display: none; }
        .page.active { display: block; }

        /* Stats Row */
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
        .stat-card { background: var(--card-bg); border-radius: var(--radius); padding: 20px; box-shadow: var(--card-shadow); }
        .stat-card .icon {
            width: 36px; height: 36px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; font-size: 1rem; margin-bottom: 12px;
        }
        .stat-card .icon.blue { background: rgba(79,109,245,0.1); }
        .stat-card .icon.green { background: rgba(52,199,89,0.1); }
        .stat-card .icon.orange { background: rgba(245,166,35,0.1); }
        .stat-card .icon.pink { background: rgba(232,67,147,0.1); }
        .stat-card .value { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
        .stat-card .value.timer { font-family: 'SF Mono', 'Fira Code', monospace; color: var(--accent); font-size: 1.2rem; }
        .stat-card .label { font-size: 0.72rem; color: var(--text-muted); }

        /* Channels */
        .channels-section { margin-bottom: 28px; }
        .channel-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .channel-card { background: var(--card-bg); border-radius: var(--radius); padding: 22px; box-shadow: var(--card-shadow); }
        .channel-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
        .channel-avatar { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
        .channel-avatar.pink { background: rgba(232,67,147,0.1); }
        .channel-avatar.purple { background: rgba(156,39,176,0.1); }
        .channel-avatar.blue { background: rgba(79,109,245,0.1); }
        .channel-info { flex: 1; min-width: 0; }
        .channel-info h3 { font-size: 0.88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .channel-info .alias { font-size: 0.72rem; color: var(--text-muted); }
        .channel-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
        .ch-stat { background: #f7f8fc; padding: 10px 8px; border-radius: var(--radius-sm); text-align: center; }
        .ch-stat .val { font-size: 1rem; font-weight: 700; display: block; }
        .ch-stat .lbl { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-top: 2px; }
        .ch-stat .val.green { color: var(--accent-green); }
        .ch-stat .val.blue { color: var(--accent); }
        .ch-stat .val.orange { color: var(--accent-orange); }
        .channel-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid var(--border); }
        .drive-link { font-size: 0.75rem; color: var(--accent); text-decoration: none; font-weight: 500; }
        .drive-badge { background: rgba(52,199,89,0.1); color: var(--accent-green); padding: 3px 8px; border-radius: 8px; font-size: 0.65rem; font-weight: 600; }
        .subfolders { margin-top: 10px; padding: 8px 10px; background: #f7f8fc; border-radius: var(--radius-sm); font-size: 0.65rem; color: var(--text-muted); line-height: 1.5; }

        /* Schedule */
        .schedule-card { background: var(--card-bg); border-radius: var(--radius); padding: 24px; box-shadow: var(--card-shadow); }
        .schedule-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; }
        .schedule-item { text-align: center; padding: 18px 12px; background: #f7f8fc; border-radius: var(--radius-sm); }
        .schedule-item .emoji { font-size: 1.3rem; margin-bottom: 8px; }
        .schedule-item h4 { font-size: 0.82rem; font-weight: 600; margin-bottom: 4px; }
        .schedule-item p { font-size: 0.72rem; color: var(--text-muted); }

        /* Drive Page */
        .drive-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .drive-card { background: var(--card-bg); border-radius: var(--radius); padding: 22px; box-shadow: var(--card-shadow); }
        .drive-card h3 { font-size: 0.92rem; font-weight: 600; margin-bottom: 6px; }
        .drive-card .count { font-size: 2rem; font-weight: 700; color: var(--accent); }
        .drive-card .meta { font-size: 0.72rem; color: var(--text-muted); margin-top: 4px; }
        .drive-card .open-btn {
            display: inline-flex; align-items: center; gap: 6px;
            margin-top: 12px; padding: 8px 14px; background: var(--accent-light);
            color: var(--accent); border: none; border-radius: 8px;
            font-size: 0.75rem; font-weight: 500; cursor: pointer; text-decoration: none;
        }
        .drive-card .open-btn:hover { background: rgba(79,109,245,0.12); }

        /* Log Page */
        .log-table { width: 100%; border-collapse: collapse; }
        .log-table th {
            text-align: left; padding: 10px 14px; font-size: 0.68rem;
            text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted);
            border-bottom: 1px solid var(--border); font-weight: 500;
        }
        .log-table td { padding: 12px 14px; font-size: 0.82rem; border-bottom: 1px solid var(--border); }
        .log-table tr:hover { background: rgba(79,109,245,0.02); }
        .log-badge {
            display: inline-block; padding: 2px 8px; border-radius: 6px;
            font-size: 0.68rem; font-weight: 500;
        }
        .log-badge.success { background: rgba(52,199,89,0.1); color: var(--accent-green); }
        .log-badge.pending { background: rgba(245,166,35,0.1); color: var(--accent-orange); }
        .log-badge.failed { background: rgba(232,67,147,0.1); color: var(--accent-pink); }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-state .emoji { font-size: 2rem; margin-bottom: 12px; }
        .empty-state p { font-size: 0.85rem; }

        .refresh-btn {
            background: var(--accent); color: #fff; border: none;
            padding: 10px 24px; border-radius: 10px; cursor: pointer;
            font-size: 0.82rem; font-weight: 500; margin-top: 18px; transition: all 0.2s;
        }
        .refresh-btn:hover { background: #3d5ce5; }
        .refresh-btn:active { transform: scale(0.97); }

        .loading { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .spinner {
            width: 28px; height: 28px; border: 2.5px solid #e8edf5; border-top-color: var(--accent);
            border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 14px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        footer { text-align: center; padding: 20px; color: var(--text-muted); font-size: 0.72rem; }
        footer strong { color: var(--accent); }

        /* iPad */
        @media only screen and (min-width: 768px) and (max-width: 1024px) and (orientation: portrait) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .hamburger { display: flex; }
            .main { margin-left: 0; padding: 28px 24px; padding-top: 64px; }
            .header-left h1 { font-size: 1.5rem; }
            .stats-row { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .channel-grid, .drive-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
        }
        @media only screen and (min-width: 768px) and (max-width: 1024px) and (orientation: landscape) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .hamburger { display: flex; }
            .main { margin-left: 0; padding: 28px 32px; padding-top: 64px; }
        }

        /* Mobile */
        @media only screen and (max-width: 767px) {
            .sidebar { transform: translateX(-100%); width: 260px; }
            .sidebar.open { transform: translateX(0); }
            .hamburger { display: flex; }
            .main { margin-left: 0; padding: 20px 16px; padding-top: 60px; }
            .header { flex-direction: column; gap: 12px; }
            .header-left h1 { font-size: 1.35rem; }
            .header-right { width: 100%; justify-content: flex-start; }
            .date-badge { padding: 6px 12px; font-size: 0.75rem; }
            .stats-row { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .stat-card { padding: 16px; }
            .stat-card .icon { width: 32px; height: 32px; font-size: 0.9rem; margin-bottom: 10px; }
            .stat-card .value { font-size: 1.3rem; }
            .stat-card .value.timer { font-size: 1.1rem; }
            .channel-grid, .drive-grid { grid-template-columns: 1fr; gap: 12px; }
            .channel-card { padding: 18px; }
            .schedule-grid { grid-template-columns: 1fr; gap: 10px; }
            .schedule-item { padding: 14px; display: flex; align-items: center; gap: 14px; text-align: left; }
            .schedule-item .emoji { margin-bottom: 0; }
            .refresh-btn { width: 100%; padding: 12px; font-size: 0.85rem; }
            .log-table { font-size: 0.75rem; }
            .log-table th, .log-table td { padding: 8px 10px; }
        }
        @media only screen and (max-width: 400px) {
            .main { padding: 16px 12px; padding-top: 56px; }
            .header-left h1 { font-size: 1.2rem; }
            .stats-row { gap: 8px; }
            .stat-card { padding: 14px; }
            .stat-card .value { font-size: 1.15rem; }
        }

        @media (hover: none) and (pointer: coarse) {
            .nav-item { padding: 12px 14px; }
            .drive-link { padding: 4px 0; }
            .refresh-btn { min-height: 44px; }
            .hamburger { min-width: 44px; min-height: 44px; }
        }
        @supports (padding: env(safe-area-inset-top)) {
            .sidebar { padding-top: calc(28px + env(safe-area-inset-top)); }
            .main { padding-top: calc(28px + env(safe-area-inset-top)); }
            footer { padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f0f1a; --bg-gradient: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
                --sidebar-bg: #1a1a2e; --card-bg: #252540;
                --text-primary: #ffffff; --text-secondary: #8b8ba3; --text-muted: #5a5a7a;
                --border: rgba(255,255,255,0.06);
                --card-shadow: 0 1px 8px rgba(0,0,0,0.2), 0 4px 24px rgba(0,0,0,0.15);
            }
            .ch-stat, .schedule-item, .subfolders { background: rgba(0,0,0,0.2); }
            .drive-card .open-btn { background: rgba(79,109,245,0.15); }
        }
    </style>
</head>
<body>
    <button class="hamburger" onclick="toggleSidebar()" aria-label="Menu">☰</button>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="icon">📊</div>
            <div>
                <div class="name">Dashboard</div>
                <div class="desc">Instagram Analytics</div>
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-item active" data-page="overview"><span class="emoji">📋</span> Overview</div>
            <div class="nav-item" data-page="channels"><span class="emoji">📱</span> Channels</div>
            <div class="nav-item" data-page="drive"><span class="emoji">📁</span> Drive</div>
            <div class="nav-item" data-page="log"><span class="emoji">📝</span> Posting Log</div>
        </nav>
        <div class="sidebar-footer">
            <div class="user-card">
                <div class="user-avatar">TF</div>
                <div class="user-info">
                    <div class="name">Taffy</div>
                    <div class="handle">@aitradersda</div>
                </div>
            </div>
        </div>
    </aside>

    <main class="main">
        <div class="header">
            <div class="header-left">
                <div class="label" id="page-label">Instagram Dashboard</div>
                <h1 id="page-title">Today <em>· Dashboard</em></h1>
            </div>
            <div class="header-right">
                <div class="date-badge"><span class="live-dot"></span> Live</div>
                <div class="date-badge" id="current-date">📅 Sep 10, 2026</div>
            </div>
        </div>

        <!-- Overview Page -->
        <div class="page active" id="page-overview">
            <div class="loading"><div class="spinner"></div>Loading live data...</div>
        </div>

        <!-- Channels Page -->
        <div class="page" id="page-channels"></div>

        <!-- Drive Page -->
        <div class="page" id="page-drive"></div>

        <!-- Posting Log Page -->
        <div class="page" id="page-log"></div>

        <footer>Managed by <strong>Taffy</strong> · Instagram DM Monitor & Auto Poster</footer>
    </main>

    <script>
        let dashboardData = null;
        let currentPage = 'overview';

        // Sidebar toggle
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.querySelector('.sidebar-overlay').classList.toggle('active');
        }

        // Page switching
        function switchPage(page) {
            currentPage = page;

            // Update nav
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.toggle('active', item.dataset.page === page);
            });

            // Update pages
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + page).classList.add('active');

            // Update header
            const titles = {
                overview: { label: 'Instagram Dashboard', title: 'Today <em>· Dashboard</em>' },
                channels: { label: 'Instagram Dashboard', title: 'Channels <em>· Accounts</em>' },
                drive: { label: 'Instagram Dashboard', title: 'Drive <em>· Videos</em>' },
                log: { label: 'Instagram Dashboard', title: 'Log <em>· History</em>' }
            };
            document.getElementById('page-label').textContent = titles[page].label;
            document.getElementById('page-title').innerHTML = titles[page].title;

            // Render page content
            if (dashboardData) renderPage(page);

            // Close sidebar on mobile
            if (window.innerWidth < 1025) toggleSidebar();
        }

        // Nav click handlers
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => switchPage(item.dataset.page));
        });

        // Close sidebar on resize
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 1025) {
                document.getElementById('sidebar').classList.remove('open');
                document.querySelector('.sidebar-overlay').classList.remove('active');
            }
        });

        // Data fetching
        async function fetchData() {
            try {
                const res = await fetch('/api/data');
                if (!res.ok) throw new Error('Failed to fetch');
                dashboardData = await res.json();
                renderAll();
            } catch (e) {
                document.getElementById('page-overview').innerHTML = `
                    <div class="loading">
                        <p>Failed to load data</p>
                        <button class="refresh-btn" onclick="fetchData()" style="margin-top:12px">Retry</button>
                    </div>`;
            }
        }

        async function forceRefresh() {
            const btn = document.querySelector('.refresh-btn');
            if (btn) btn.disabled = true;
            try {
                await fetch('/api/refresh', { method: 'POST' });
                await fetchData();
            } finally {
                if (btn) btn.disabled = false;
            }
        }

        function renderAll() {
            renderPage('overview');
            renderPage('channels');
            renderPage('drive');
            renderPage('log');
        }

        function renderPage(page) {
            if (!dashboardData || !dashboardData.accounts) return;
            const accounts = dashboardData.accounts;
            const list = Object.values(accounts);
            const totalFollowers = list.reduce((s, a) => s + (a.followers || 0), 0);
            const totalDrive = list.reduce((s, a) => s + (a.driveVideos || 0), 0);
            const todayPosts = (dashboardData.postingLog || []).filter(p =>
                new Date(p.timestamp).toDateString() === new Date().toDateString()
            ).length;
            const colors = ['pink', 'purple', 'blue'];

            if (page === 'overview') {
                document.getElementById('page-overview').innerHTML = `
                    <div class="stats-row">
                        <div class="stat-card">
                            <div class="icon blue">👥</div>
                            <div class="value">${totalFollowers > 0 ? formatNum(totalFollowers) : '<100'}</div>
                            <div class="label">Total Followers</div>
                        </div>
                        <div class="stat-card">
                            <div class="icon green">🎬</div>
                            <div class="value">${todayPosts}</div>
                            <div class="label">Posted Today</div>
                        </div>
                        <div class="stat-card">
                            <div class="icon orange">⏱️</div>
                            <div class="value timer" id="next-video-timer">--:--:--</div>
                            <div class="label">Next Video In</div>
                        </div>
                        <div class="stat-card">
                            <div class="icon pink">📁</div>
                            <div class="value">${formatNum(totalDrive)}</div>
                            <div class="label">Videos in Drive</div>
                        </div>
                    </div>
                    <div class="schedule-card">
                        <div class="card-title">Posting Schedule</div>
                        <div class="schedule-grid">
                            <div class="schedule-item"><div class="emoji">🎯</div><h4>Daily Goal</h4><p>6 videos total (2 per channel)</p></div>
                            <div class="schedule-item"><div class="emoji">📋</div><h4>Order</h4><p>In sequence from each folder, no repeats</p></div>
                            <div class="schedule-item"><div class="emoji">⚡</div><h4>Workflow</h4><p>Download → Transcribe → Caption → Post</p></div>
                        </div>
                        <div style="text-align:center"><button class="refresh-btn" onclick="forceRefresh()">🔄 Refresh Data</button></div>
                    </div>`;
                updateCountdown();
            }

            if (page === 'channels') {
                document.getElementById('page-channels').innerHTML = `
                    <div class="channel-grid">
                        ${list.map((a, i) => `
                            <div class="channel-card">
                                <div class="channel-header">
                                    <div class="channel-avatar ${colors[i]}">${a.icon}</div>
                                    <div class="channel-info">
                                        <h3>@${a.username}</h3>
                                        <span class="alias">${a.alias}</span>
                                    </div>
                                </div>
                                <div class="channel-stats">
                                    <div class="ch-stat"><span class="val">${a.followers > 0 ? formatNum(a.followers) : '<100'}</span><span class="lbl">Followers</span></div>
                                    <div class="ch-stat"><span class="val green">${a.reach > 0 ? formatNum(a.reach) : '0'}</span><span class="lbl">Reach</span></div>
                                    <div class="ch-stat"><span class="val blue">${a.mediaCount || 0}</span><span class="lbl">Posts</span></div>
                                    <div class="ch-stat"><span class="val orange">${a.driveVideos || 0}</span><span class="lbl">Drive</span></div>
                                </div>
                                <div class="channel-footer">
                                    <a href="https://drive.google.com/drive/folders/${a.driveFolderId}" target="_blank" class="drive-link">📁 Google Drive</a>
                                    <span class="drive-badge">${a.driveVideos} videos</span>
                                </div>
                                ${a.subfolders ? `<div class="subfolders">📂 ${a.subfolders.map(f => f.name).join(' · ')}</div>` : ''}
                            </div>
                        `).join('')}
                    </div>`;
            }

            if (page === 'drive') {
                const allFolders = [];
                list.forEach(a => {
                    allFolders.push({ name: a.name, username: a.username, id: a.driveFolderId, count: a.driveVideos, icon: a.icon });
                    if (a.subfolders) {
                        a.subfolders.forEach(f => {
                            allFolders.push({ name: f.name, username: a.username, id: f.id, count: '—', icon: '📂', sub: true });
                        });
                    }
                });
                document.getElementById('page-drive').innerHTML = `
                    <div class="card-title">Google Drive Folders</div>
                    <div class="drive-grid">
                        ${allFolders.map(f => `
                            <div class="drive-card">
                                <h3>${f.icon} ${f.name}</h3>
                                <div class="count">${f.count}</div>
                                <div class="meta">${f.sub ? 'Subfolder' : '@' + f.username}</div>
                                <a href="https://drive.google.com/drive/folders/${f.id}" target="_blank" class="open-btn">📂 Open in Drive</a>
                            </div>
                        `).join('')}
                    </div>`;
            }

            if (page === 'log') {
                const logs = dashboardData.postingLog || [];
                if (logs.length === 0) {
                    document.getElementById('page-log').innerHTML = `
                        <div class="empty-state">
                            <div class="emoji">📝</div>
                            <p>No posts yet today. Videos will appear here after posting.</p>
                        </div>`;
                } else {
                    document.getElementById('page-log').innerHTML = `
                        <div class="card" style="overflow-x:auto">
                            <table class="log-table">
                                <thead><tr><th>Time</th><th>Account</th><th>Video</th><th>Status</th></tr></thead>
                                <tbody>
                                    ${logs.map(p => `
                                        <tr>
                                            <td>${new Date(p.timestamp).toLocaleTimeString()}</td>
                                            <td>@${p.username}</td>
                                            <td>${p.videoName || '—'}</td>
                                            <td><span class="log-badge ${p.status || 'success'}">${p.status || 'posted'}</span></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>`;
                }
            }
        }

        function formatNum(n) {
            if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
            if (n >= 1000) return (n/1000).toFixed(1) + 'K';
            return n.toString();
        }

        function updateCountdown() {
            const now = new Date();
            const h = now.getHours();
            let next;
            if (h < 9) { next = new Date(now); next.setHours(9,0,0,0); }
            else if (h < 18) { next = new Date(now); next.setHours(18,0,0,0); }
            else { next = new Date(now); next.setDate(next.getDate()+1); next.setHours(9,0,0,0); }
            const diff = next - now;
            const hh = Math.floor(diff/3600000);
            const mm = Math.floor((diff%3600000)/60000);
            const ss = Math.floor((diff%60000)/1000);
            const el = document.getElementById('next-video-timer');
            if (el) el.textContent = `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
        }

        document.getElementById('current-date').textContent = '📅 ' + new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

        fetchData();
        setInterval(updateCountdown, 1000);
        setInterval(fetchData, 300000);
    </script>
</body>
</html>
